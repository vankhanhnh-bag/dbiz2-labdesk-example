name: Rebuild derived project tables

on:
  push:
    branches:
      - main
    paths:
      - "docs/function-list/w0-scope.md"
      - "docs/function-list/w1-function-list.md"
      - "docs/function-list/w4-priorities.md"
      - "docs/function-list/w5-handover.md"
      - "docs/function-list/w6-cash-flow.md"
      - "scripts/rebuild_derived_docs.py"
      - ".github/workflows/rebuild-derived-docs.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rebuild-derived-project-tables
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Rebuild derived Markdown tables
        run: python scripts/rebuild_derived_docs.py

      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/function-list/w2-cost.md \
                  docs/function-list/w4-priorities.md \
                  docs/function-list/w5-handover.md \
                  docs/function-list/w6-cash-flow.md

          if git diff --cached --quiet; then
            echo "All derived Markdown tables are already up to date."
          else
            git commit -m "chore: rebuild derived project tables"
            git push
          fi
